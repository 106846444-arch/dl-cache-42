name: 临时诊断2-凭证内容比对

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      QUARK_AUTH_JSON: ${{ secrets.QUARK_AUTH_JSON }}
      CLIENT_INFO_IDE_TYPE: WorkBuddy
      CLIENT_INFO_PLATFORM: WorkBuddy
      CLIENT_INFO_PRODUCT_NAME: WorkBuddy
    steps:
      - name: 装 CLI 并落授权
        run: |
          mkdir -p qs
          curl -sL --retry 2 --connect-timeout 20 -o qs/q.zip \
            "https://pdds.quark.cn/download/stfile/kkqqltosqklokmsmf/quarkclouddrive-1.0.12.zip"
          unzip -q qs/q.zip -d qs/unz
          CLI=$(find qs/unz -name "quark-drive.cjs" | head -1)
          SDIR=$(dirname "$CLI")
          mkdir -p quark_skill/scripts quark_skill/workbuddy
          cp -r "$SDIR"/* quark_skill/scripts/ 2>/dev/null || true
          printf '%s' "$QUARK_AUTH_JSON" > quark_skill/workbuddy/config.json
          echo "CLI 就位，凭证 $(wc -c < quark_skill/workbuddy/config.json) 字节"

      - name: 比对凭证内容
        run: |
          echo "===== 1) 文件指纹 ====="
          ls -la quark_skill/workbuddy/config.json
          sha256sum quark_skill/workbuddy/config.json
          echo "本地对照: 81ce273aa8245ce21d80412654cae7c9...（1205 字节）"
          echo "===== 2) 字段（脱敏） ====="
          python3 - <<'PYEOF'
          import json
          raw = open("quark_skill/workbuddy/config.json", "rb").read()
          print("字节数:", len(raw))
          d = json.loads(raw.decode("utf-8"))
          print("顶层键:", sorted(d.keys()))
          uid = d.get("currentUserId")
          print("currentUserId:", uid)
          wa = d.get("agent_auth", {}).get("workbuddy", {})
          print("agent_auth.workbuddy.userId:", wa.get("userId"))
          print("agent_auth.workbuddy.login_time:", wa.get("login_time"))
          u = d.get(uid) or {}
          print("update_time:", u.get("update_time"))
          at = u.get("accessToken") or ""
          print("accessToken 长度:", len(at), "| 头:", at[:8], "| 尾:", at[-8:])
          rt = u.get("refreshToken") or ""
          print("refreshToken 长度:", len(rt), "| 头:", rt[:8], "| 尾:", rt[-8:])
          PYEOF
          echo "===== 3) 目录可写性 ====="
          touch quark_skill/scripts/_wtest && echo "scripts 可写 ✓" && rm -f quark_skill/scripts/_wtest
          touch quark_skill/workbuddy/_wtest && echo "workbuddy 可写 ✓" && rm -f quark_skill/workbuddy/_wtest
          echo "===== 4) get-user-info ====="
          cd quark_skill/scripts
          CLIENT_INFO_IDE_TYPE=WorkBuddy node quark-drive.cjs get-user-info --session-input diag --session-id diag 2>&1 | tail -2
          echo "===== 5) 跑完后 config 是否被改写（刷新痕迹） ====="
          cd - >/dev/null
          sha256sum quark_skill/workbuddy/config.json
