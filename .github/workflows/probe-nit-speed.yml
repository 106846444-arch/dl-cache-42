name: probe-nit-speed
# 2026-10-22 新增：可行性探针（只读测速，不下完整文件、不上传任何东西）
# 目的：用事实回答「NIT / 116 走 GitHub 机房代抓值不值」
#   1) 机房到 nitroflare、到 116pan 的实际下载速度
#   2) 机房能否自己从文件页提取直链（决定要不要在 runner 里做登录/取链）
on:
  workflow_dispatch:
    inputs:
      nit_direct:
        description: 'NIT 直链'
        required: false
        default: ''
      link116:
        description: '116 直链'
        required: false
        default: ''
      nit_page:
        description: 'NIT 文件页（用于测"机房能否自己取链"）'
        required: false
        default: ''

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 机房位置 / 出口信息
        run: |
          echo "== runner 出口 =="
          curl -sS -m 15 https://ipinfo.io/json || echo "(查不到)"

      - name: 测速函数准备
        run: |
          cat > /tmp/measure.sh <<'EOF'
          #!/usr/bin/env bash
          # $1=url  $2=label  $3=秒数
          url="$1"; label="$2"; dur="${3:-15}"
          echo "----- [$label] -----"
          echo "URL: ${url:0:90}"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          # 总大小：优先 Content-Range（Range 请求），退回 Content-Length
          cr=$(curl -sS -m 25 -A "$UA" -r 0-0 -D - -o /dev/null "$url" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="content-range:"{print $2}')
          total=$(echo "$cr" | awk -F'/' '{print $2}')
          if [ -z "$total" ]; then
            total=$(curl -sSI -m 25 -A "$UA" "$url" 2>/dev/null | tr -d '\r' | awk 'tolower($1)=="content-length:"{print $2}' | tail -1)
          fi
          echo "总大小: ${total:-未知} 字节"

          # 单线程：拉 $dur 秒
          s1=$(curl -sS -m "$dur" -A "$UA" -r 0- -o /dev/null -w '%{size_download}' "$url" 2>/dev/null || echo 0)
          echo "单线程 ${dur}s: $((s1)) 字节 => $(awk -v b="$s1" -v d="$dur" 'BEGIN{printf "%.2f", b/d/1048576}') MB/s"

          # 8 线程：把文件切 8 段并发，各拉 $dur 秒
          seg=$(( total / 8 ))
          if [ -z "$total" ] || [ "$seg" -lt 1048576 ]; then seg=104857600; fi
          rm -f /tmp/part_*; 
          for i in 0 1 2 3 4 5 6 7; do
            s=$(( i * seg )); e=$(( s + seg - 1 ))
            ( curl -sS -m "$dur" -A "$UA" -r "$s-$e" -o /dev/null -w '%{size_download}\n' "$url" 2>/dev/null || echo 0 ) > /tmp/part_$i &
          done
          wait
          sum=$(cat /tmp/part_* 2>/dev/null | awk '{t+=$1} END{print t+0}')
          echo "8线程 ${dur}s: $((sum)) 字节 => $(awk -v b="$sum" -v d="$dur" 'BEGIN{printf "%.2f", b/d/1048576}') MB/s"
          EOF
          chmod +x /tmp/measure.sh

      - name: 测 NIT 直链
        if: ${{ github.event.inputs.nit_direct != '' }}
        run: /tmp/measure.sh "${{ github.event.inputs.nit_direct }}" "NIT 直链" 15

      - name: 测 116 直链
        if: ${{ github.event.inputs.link116 != '' }}
        run: /tmp/measure.sh "${{ github.event.inputs.link116 }}" "116 直链" 15

      - name: 机房能否自己从 NIT 文件页取到直链
        if: ${{ github.event.inputs.nit_page != '' }}
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          echo "== 抓文件页 =="
          code=$(curl -sS -m 30 -A "$UA" -o /tmp/page.html -w '%{http_code}' "${{ github.event.inputs.nit_page }}")
          echo "HTTP $code, 大小 $(wc -c < /tmp/page.html) 字节"
          echo "== 页面里是否含 nitroflare 直链 =="
          grep -oE 'https://[a-z0-9]+\.nitroflare\.com/d/[A-Za-z0-9]+/[^"'"'"' <]+' /tmp/page.html | head -3 || echo "(没找到直链)"
          echo "== 是否出现登录/验证码特征 =="
          grep -ioE '(sign in|login|captcha|recaptcha|please wait|free user)' /tmp/page.html | sort | uniq -c | head -8 || true
