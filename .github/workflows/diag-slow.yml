name: 诊断-并发上限探测

# ★ 一次性诊断（2026-10-26）。实测上传并发【真天花板】。
#   4 档太长，压成 3 档 W ∈ {14, 24, 40}（14 基线 / 24 中档 / 40 探顶），
#   每档【40 个 200MB 随机文件】（文件数 ≥ 最大 W=40，并发槽全填满；
#   各段总字节一致 8GB，便于横向比聚合速率；随机内容防秒传）。
#   每段独立生成+上传+清理，磁盘峰值 ≈ 8GB。
#
# 关注四量（从「段汇总」后的逐文件行读，GitHub 会把含花括号的 JSON 行打码，
#   但逐文件行/纯文本汇总行不受影响）：
#   ① 聚合速率 = 总字节/总时长 —— 是否随 W 线性涨（平台=出口/CPU 封顶）
#   ② 单文件均速 = 200MB/单文件用时 —— 是否随 W 掉（掉=夸克按账号限流=风控信号）
#   ③ 失败数 / 龟速命中数 —— 是否随 W 上升（风控/ACK 失败面放大）
#   ④ loadavg 均值 —— 是否逼近 vCPU 数（CPU 撞墙）
#
# 用法：跑完用 _dev_分析诊断.py 读四段逐文件行 → 对比上四量 →
#   选「单文件均速不降 + 0 失败 + 聚合仍线性」的最高 W 定稿 MAX_WORKERS。
#   清理：删云端 _diag_w14/_diag_w24/_diag_w40 → DELETE 本文件。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      QUARK_AUTH_JSON: ${{ secrets.QUARK_AUTH_JSON }}
      CLIENT_INFO_IDE_TYPE: WorkBuddy
      CLIENT_INFO_PLATFORM: WorkBuddy
      CLIENT_INFO_PRODUCT_NAME: WorkBuddy

    steps:
      - name: 0. 检出仓库（内置 CLI 副本）
        uses: actions/checkout@v4

      - name: 1. 装 CLI 并落授权
        run: |
          if [ -f vendor/quark_skill/scripts/quark-drive.cjs ]; then
            mkdir -p quark_skill
            cp -r vendor/quark_skill/* quark_skill/
            echo "CLI 就位，来源：仓库内置副本"
          else
            echo "::error::仓库无内置 CLI 副本（vendor/quark_skill）"
            exit 1
          fi
          mkdir -p quark_skill/workbuddy
          printf '%s' "$QUARK_AUTH_JSON" > quark_skill/workbuddy/config.json
          echo "config.json 字节数: $(wc -c < quark_skill/workbuddy/config.json)"
          INFO=$(cd quark_skill/scripts && node quark-drive.cjs get-user-info --session-input 诊断 --session-id diag-wprobe 2>&1 | tail -3)
          echo "授权自检: $INFO"
          case "$INFO" in
            *'"code":0'*|*'"code": 0'*) echo "授权 OK" ;;
            *) echo "::error::夸克授权失败：$INFO"; exit 1 ;;
          esac

      - name: 2. 写诊断脚本
        run: |
          cat > diag_wprobe.py <<'PYEOF'
          import json, os, subprocess, sys, time, threading, queue

          folder = sys.argv[1]
          src_dir = sys.argv[2]
          WORKERS = int(os.environ.get("UPLOAD_WORKERS") or "4")
          SLOW_MULT = float(os.environ.get("SLOW_MULT") or "12")
          SLOW_GRACE = float(os.environ.get("SLOW_GRACE") or "240")
          SCRIPTS = "quark_skill/scripts"

          def cli(args, watch_bytes=0, timeout=3600):
              cmd = ["node", "quark-drive.cjs"] + args + [
                  "--session-input", "诊断", "--session-id", "diag-wprobe"]
              slow_deadline = None
              if watch_bytes:
                  slow_deadline = (watch_bytes / (3.0 * 1048576.0) * SLOW_MULT
                                   + SLOW_GRACE)
              t0 = time.time()
              p = subprocess.Popen(cmd, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT, cwd=SCRIPTS)
              buf = []
              def _rd():
                  try:
                      for ln in p.stdout:
                          buf.append(ln)
                  except Exception:
                      pass
              threading.Thread(target=_rd, daemon=True).start()
              killed = None
              while True:
                  if p.poll() is not None:
                      break
                  el = time.time() - t0
                  if el > timeout:
                      killed = "timeout"; break
                  if slow_deadline is not None and el > slow_deadline:
                      killed = "slow"; break
                  time.sleep(1.0)
              if killed:
                  try:
                      p.kill()
                  except Exception:
                      pass
                  try:
                      p.wait(timeout=15)
                  except Exception:
                      pass
                  return {"code": -2, "msg": "watchdog-%s" % killed}, killed
              p.wait()
              text = b"".join(buf).decode("utf-8", "replace")
              last = None
              for ln in text.splitlines():
                  try:
                      o = json.loads(ln)
                  except Exception:
                      continue
                  if isinstance(o, dict) and o.get("type") == "result":
                      last = o
              return (last or {"code": -1, "msg": text[-300:]}), None

          res = {}
          for _try in range(5):
              res, _ = cli(["create-folder", "--dir-path", folder, "--parent-fid", "0"])
              print("create-folder(第%d次) -> %s %s" % (_try + 1, res.get("code"), res.get("msg")), flush=True)
              if res.get("code") == 0:
                  break
              time.sleep(8)
          if res.get("code") != 0:
              print("::error::建目录失败: %s" % res.get("msg"), flush=True)
              sys.exit(1)
          fid = ((res.get("data") or {}).get("fid")
                 or (res.get("data") or {}).get("id") or "")
          print("目标目录 %s fid = %s" % (folder, fid), flush=True)

          tasks = queue.Queue()
          for fn in sorted(os.listdir(src_dir)):
              tasks.put(os.path.join(src_dir, fn))
          DONE = object()
          results = []
          lock = threading.Lock()
          loadavg = []
          stop_sampler = threading.Event()

          def sampler():
              while not stop_sampler.is_set():
                  try:
                      with open("/proc/loadavg") as f:
                          loadavg.append(float(f.read().split()[0]))
                  except Exception:
                      pass
                  stop_sampler.wait(2.0)

          threading.Thread(target=sampler, daemon=True).start()

          def worker():
              while True:
                  p = tasks.get()
                  if p is DONE:
                      break
                  name = os.path.basename(p)
                  sz = os.path.getsize(p)
                  t0 = time.time()
                  killed = None
                  try:
                      r, killed = cli(["upload", os.path.abspath(p), "--parent-fid", fid],
                                      watch_bytes=sz)
                  except Exception as e:
                      r = {"code": -1, "msg": str(e)[:120]}
                  el = time.time() - t0
                  ok = (r.get("code") == 0)
                  rec = {"name": name, "size": sz, "sec": round(el, 1),
                         "mbps": round(sz / 1048576.0 / max(el, 1), 3),
                         "ok": ok, "code": r.get("code"),
                         "msg": (r.get("msg") or "")[:100], "killed": killed}
                  with lock:
                      results.append(rec)
                  print("  %s %-16s %12d字节  用时 %7.1fs  均速 %6.3fMB/s%s"
                        % ("OK" if ok else "XX", name, sz, el, rec["mbps"],
                           ("  [被杀:%s]" % killed) if killed else ""), flush=True)
                  tasks.task_done()

          t_start = time.time()
          cons = [threading.Thread(target=worker, daemon=True) for _ in range(WORKERS)]
          for c in cons:
              c.start()
          for _ in range(WORKERS):
              tasks.put(DONE)
          for c in cons:
              c.join()
          total_el = time.time() - t_start
          stop_sampler.set()

          ok_n = sum(1 for r in results if r["ok"])
          tot_b = sum(r["size"] for r in results if r["ok"])
          slow_n = sum(1 for r in results if r.get("killed") == "slow")
          load_avg = round(sum(loadavg) / len(loadavg), 2) if loadavg else None
          per = [r["mbps"] for r in results if r["ok"]]
          per_avg = round(sum(per) / len(per), 3) if per else None
          print("==== 段汇总 %s ====" % folder, flush=True)
          print("W=%d 文件=%d 成功=%d 失败=%d 龟速=%d 总字节=%d 总时长=%.1fs"
                % (WORKERS, len(results), ok_n, len(results) - ok_n, slow_n,
                   tot_b, total_el), flush=True)
          print("聚合=%.2fMB/s 单文件均速=%.3fMB/s loadavg均=%.2f nproc=%s"
                % (round(tot_b / 1048576.0 / max(total_el, 1), 2), per_avg,
                   load_avg, os.cpu_count()), flush=True)
          PYEOF
          python3 -m py_compile diag_wprobe.py && echo "诊断脚本编译 OK"

      - name: 3. 段W14（40×200MB）
        env:
          UPLOAD_WORKERS: "14"
        run: |
          mkdir -p tW && for i in $(seq 1 40); do dd if=/dev/urandom of=tW/f$i.bin bs=1M count=200 status=none; done
          python3 diag_wprobe.py _diag_w14 tW
          rm -rf tW

      - name: 4. 段W24（40×200MB）
        env:
          UPLOAD_WORKERS: "24"
        run: |
          mkdir -p tW && for i in $(seq 1 40); do dd if=/dev/urandom of=tW/f$i.bin bs=1M count=200 status=none; done
          python3 diag_wprobe.py _diag_w24 tW
          rm -rf tW

      - name: 5. 段W40（40×200MB）
        env:
          UPLOAD_WORKERS: "40"
        run: |
          mkdir -p tW && for i in $(seq 1 40); do dd if=/dev/urandom of=tW/f$i.bin bs=1M count=200 status=none; done
          python3 diag_wprobe.py _diag_w40 tW
          rm -rf tW

      - name: 6. 完成
        run: |
          echo "诊断完成。回本机用 _dev_分析诊断.py 读三段逐文件行，对比："
          echo "  聚合速率 / 单文件均速(掉=夸克按账号限流) / 失败·龟速数 / loadavg"
          echo "清理提醒：删 _diag_w14/_diag_w24/_diag_w40 后 DELETE 本 workflow。"
