name: 诊断-龟速规律与并发上限

# ★ 一次性诊断（2026-10-25 16:20）。起因：run #25/#26 挖出「龟速会话」——
#   个别上传会话速率掉到 0.13~0.16MB/s（正常 3.4~3.7，慢 20 倍），
#   而且【是成功的】：不报错不超时，就一直龟速传到完，单条吃掉 51 分钟。
#   同一批同样 500MB 的卷 8 条 3.6MB/s、1 条 0.16MB/s ⇒ 随机命中。
#
# 本诊断一次跑三件事：
#   段A 龟速规律：6 个不同体积（100/250/400/600/900/1200MB）并发传，
#       带【宽松看门狗】——真撞龟速就杀掉重传，从而同时验证
#       「重传能不能救回来」这个关键假设。
#   段B1/段B2 并发上限：同批 14 个 300MB 文件，W=10 vs W=14 对照，
#       记聚合/单文件均速/失败率/loadavg（判断 4 vCPU 是不是先撞的墙）。
#
# 用法：跑完读日志三个「段汇总」JSON → 删云端 _diag_slow*/_diag_w*/_diag_w14*
#      → DELETE 本文件（仓库永远只留 1 个 workflow）。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      QUARK_AUTH_JSON: ${{ secrets.QUARK_AUTH_JSON }}
      CLIENT_INFO_IDE_TYPE: WorkBuddy
      CLIENT_INFO_PLATFORM: WorkBuddy
      CLIENT_INFO_PRODUCT_NAME: WorkBuddy

    steps:
      - name: 0. 检出仓库（内置 CLI 副本）
        uses: actions/checkout@v4

      - name: 1. 装 CLI 并落授权
        run: |
          if [ -f vendor/quark_skill/scripts/quark-drive.cjs ]; then
            mkdir -p quark_skill
            cp -r vendor/quark_skill/* quark_skill/
            echo "CLI 就位，来源：仓库内置副本"
          else
            echo "::error::仓库无内置 CLI 副本（vendor/quark_skill）"
            exit 1
          fi
          mkdir -p quark_skill/workbuddy
          printf '%s' "$QUARK_AUTH_JSON" > quark_skill/workbuddy/config.json
          echo "config.json 字节数: $(wc -c < quark_skill/workbuddy/config.json)"
          INFO=$(cd quark_skill/scripts && node quark-drive.cjs get-user-info --session-input 诊断 --session-id diag-slow 2>&1 | tail -3)
          echo "授权自检: $INFO"
          case "$INFO" in
            *'"code":0'*|*'"code": 0'*) echo "授权 OK" ;;
            *) echo "::error::夸克授权失败：$INFO"; exit 1 ;;
          esac

      - name: 2. 造测试文件 + 写诊断脚本
        run: |
          cat > diag_slow.py <<'PYEOF'
          import json, os, subprocess, sys, time, threading, queue

          folder = sys.argv[1]
          src_dir = sys.argv[2]
          WORKERS = int(os.environ.get("UPLOAD_WORKERS") or "4")
          # ★ 宽松看门狗：正常会话的 12 倍时长 + 240s 才杀。
          #   目的是【看得见】龟速（不杀它就永远看不到自然分布），
          #   同时保证整个诊断不会因为一条龟速拖到天荒地老。
          SLOW_MULT = float(os.environ.get("SLOW_MULT") or "12")
          SLOW_GRACE = float(os.environ.get("SLOW_GRACE") or "240")
          SCRIPTS = "quark_skill/scripts"

          def proc_io(pid):
              """取子进程累计读字节（rchar≈已读文件字节→近似已上传量）"""
              try:
                  with open("/proc/%d/io" % pid) as f:
                      for ln in f:
                          if ln.startswith("rchar:"):
                              return int(ln.split()[1])
              except Exception:
                  pass
              return None

          def cli(args, watch_bytes=0, timeout=3600):
              cmd = ["node", "quark-drive.cjs"] + args + [
                  "--session-input", "诊断", "--session-id", "diag-slow"]
              slow_deadline = None
              if watch_bytes:
                  slow_deadline = (watch_bytes / (3.0 * 1048576.0) * SLOW_MULT
                                   + SLOW_GRACE)
              t0 = time.time()
              p = subprocess.Popen(cmd, stdout=subprocess.PIPE,
                                   stderr=subprocess.STDOUT, cwd=SCRIPTS)
              buf = []
              def _rd():
                  try:
                      for ln in p.stdout:
                          buf.append(ln)
                  except Exception:
                      pass
              threading.Thread(target=_rd, daemon=True).start()
              killed = None
              while True:
                  if p.poll() is not None:
                      break
                  el = time.time() - t0
                  if el > timeout:
                      killed = "timeout"; break
                  if slow_deadline is not None and el > slow_deadline:
                      killed = "slow"; break
                  time.sleep(1.0)
              if killed:
                  try:
                      p.kill()
                  except Exception:
                      pass
                  try:
                      p.wait(timeout=15)
                  except Exception:
                      pass
                  return {"code": -2, "msg": "watchdog-%s" % killed}, killed
              p.wait()
              text = b"".join(buf).decode("utf-8", "replace")
              last = None
              for ln in text.splitlines():
                  try:
                      o = json.loads(ln)
                  except Exception:
                      continue
                  if isinstance(o, dict) and o.get("type") == "result":
                      last = o
              return (last or {"code": -1, "msg": text[-300:]}), None

          # 建目录（幂等，5 次重试绕瞬时 1007）
          res = {}
          for _try in range(5):
              res, _ = cli(["create-folder", "--dir-path", folder, "--parent-fid", "0"])
              print("create-folder(第%d次) -> %s %s" % (_try + 1, res.get("code"), res.get("msg")), flush=True)
              if res.get("code") == 0:
                  break
              time.sleep(8)
          if res.get("code") != 0:
              print("::error::建目录失败: %s" % res.get("msg"), flush=True)
              sys.exit(1)
          fid = ((res.get("data") or {}).get("fid")
                 or (res.get("data") or {}).get("id") or "")
          print("目标目录 %s fid = %s" % (folder, fid), flush=True)

          tasks = queue.Queue()
          for fn in sorted(os.listdir(src_dir)):
              tasks.put(os.path.join(src_dir, fn))
          DONE = object()
          results = []
          lock = threading.Lock()
          loadavg = []
          stop_sampler = threading.Event()

          def sampler():
              while not stop_sampler.is_set():
                  try:
                      with open("/proc/loadavg") as f:
                          loadavg.append(float(f.read().split()[0]))
                  except Exception:
                      pass
                  stop_sampler.wait(2.0)

          threading.Thread(target=sampler, daemon=True).start()

          def worker():
              while True:
                  p = tasks.get()
                  if p is DONE:
                      break
                  name = os.path.basename(p)
                  sz = os.path.getsize(p)
                  t0 = time.time()
                  killed = None
                  try:
                      r, killed = cli(["upload", os.path.abspath(p), "--parent-fid", fid],
                                      watch_bytes=sz)
                  except Exception as e:
                      r = {"code": -1, "msg": str(e)[:120]}
                  el = time.time() - t0
                  ok = (r.get("code") == 0)
                  rec = {"name": name, "size": sz, "sec": round(el, 1),
                         "mbps": round(sz / 1048576.0 / max(el, 1), 3),
                         "ok": ok, "code": r.get("code"),
                         "msg": (r.get("msg") or "")[:100], "killed": killed}
                  # ★ 关键验证：若被判龟速，当场重传一次，看能否恢复正常速率
                  if killed == "slow":
                      print("  ⚠ %s 疑似龟速（%.3fMB/s），当场重传验证…" % (name, rec["mbps"]), flush=True)
                      t1 = time.time()
                      r2, k2 = cli(["upload", os.path.abspath(p), "--parent-fid", fid],
                                   watch_bytes=sz)
                      el2 = time.time() - t1
                      rec["retry_sec"] = round(el2, 1)
                      rec["retry_mbps"] = round(sz / 1048576.0 / max(el2, 1), 3)
                      rec["retry_ok"] = (r2.get("code") == 0)
                      rec["retry_killed"] = k2
                      print("  → 重传结果: %s %.3fMB/s%s"
                            % ("成功" if rec["retry_ok"] else "仍失败", rec["retry_mbps"],
                               (" 又被杀" if k2 else "")), flush=True)
                  with lock:
                      results.append(rec)
                  print("  %s %-16s %9d字节  用时 %7.1fs  均速 %6.3fMB/s%s"
                        % ("✓" if ok else "✗", name, sz, el, rec["mbps"],
                           ("  [被杀:%s]" % killed) if killed else ""), flush=True)
                  tasks.task_done()

          t_start = time.time()
          cons = [threading.Thread(target=worker, daemon=True) for _ in range(WORKERS)]
          for c in cons:
              c.start()
          for _ in range(WORKERS):
              tasks.put(DONE)
          for c in cons:
              c.join()
          total_el = time.time() - t_start
          stop_sampler.set()

          ok_n = sum(1 for r in results if r["ok"])
          tot_b = sum(r["size"] for r in results if r["ok"])
          slow_n = sum(1 for r in results if r.get("killed") == "slow")
          load_avg = round(sum(loadavg) / len(loadavg), 2) if loadavg else None
          print("==== 段汇总 %s ====" % folder, flush=True)
          print(json.dumps({
              "folder": folder, "workers": WORKERS, "files": len(results),
              "ok": ok_n, "fail": len(results) - ok_n, "slow_hit": slow_n,
              "total_bytes": tot_b, "total_sec": round(total_el, 1),
              "agg_mbps": round(tot_b / 1048576.0 / max(total_el, 1), 2),
              "loadavg_avg": load_avg, "nproc": os.cpu_count(),
              "details": results,
          }, ensure_ascii=False), flush=True)
          PYEOF
          python3 -m py_compile diag_slow.py && echo "诊断脚本编译 OK"
          # 段A：6 档体积（随机内容防秒传）
          mkdir -p tA
          for sz in 100 250 400 600 900 1200; do
            dd if=/dev/urandom of=tA/vol${sz}.bin bs=1M count=$sz status=none
          done
          # 段B：14 个 300MB（两段共用同批内容，但各自重新随机，避开秒传）
          mkdir -p tB1 tB2
          for d in tB1 tB2; do
            for i in $(seq 1 14); do
              dd if=/dev/urandom of=$d/f$i.bin bs=1M count=300 status=none
            done
          done
          du -sh tA tB1 tB2; df -h . | tail -1; nproc

      - name: 3. 段A：6 档体积并发（摸龟速规律 + 验证重传能否救回）
        env:
          UPLOAD_WORKERS: "6"
        run: python3 diag_slow.py _diag_slowA tA

      - name: 4. 段B1：W=10 基线
        env:
          UPLOAD_WORKERS: "10"
        run: python3 diag_slow.py _diag_slowB1 tB1

      - name: 5. 段B2：W=14 实验组
        env:
          UPLOAD_WORKERS: "14"
        run: python3 diag_slow.py _diag_slowB2 tB2

      - name: 6. 完成
        run: |
          echo "诊断完成。回本机读三个「段汇总」JSON 对比："
          echo "  段A: slow_hit 命中哪几档 + retry_mbps 是否恢复正常（验证重传假设）"
          echo "  段B1/B2: agg_mbps / 单文件均速 / fail / loadavg_avg（4 vCPU 是不是先撞的墙）"
          echo "清理提醒：删 _diag_slowA / _diag_slowB1 / _diag_slowB2 后 DELETE 本 workflow。"
