name: 诊断-上传并发对照

# ★ 一次性诊断（2026-10-24 20:10）：测「上传并发 4 vs 6」的真实聚合吞吐。
#   背景：单会话限速 ~3.3MB/s（20+ 个 500MB 卷全部 143~158s 实证），
#   现网 4 路卷并行。run #30+#31 意外并行（8 会话）时每卷不降速 ⇒ 疑有空间，
#   但缺同条件对照，故跑本诊断：两段各 8 个随机文件（防秒传），只差 W。
#   用法：跑完读日志两个「段汇总」JSON，删 _diag_w4/_diag_w6 后 DELETE 本文件。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      QUARK_AUTH_JSON: ${{ secrets.QUARK_AUTH_JSON }}
      CLIENT_INFO_IDE_TYPE: WorkBuddy
      CLIENT_INFO_PLATFORM: WorkBuddy
      CLIENT_INFO_PRODUCT_NAME: WorkBuddy

    steps:
      - name: 0. 检出仓库（内置 CLI 副本）
        uses: actions/checkout@v4

      - name: 1. 装 CLI 并落授权
        run: |
          if [ -f vendor/quark_skill/scripts/quark-drive.cjs ]; then
            mkdir -p quark_skill
            cp -r vendor/quark_skill/* quark_skill/
            echo "CLI 就位，来源：仓库内置副本"
          else
            echo "::error::仓库无内置 CLI 副本（vendor/quark_skill）"
            exit 1
          fi
          mkdir -p quark_skill/workbuddy
          printf '%s' "$QUARK_AUTH_JSON" > quark_skill/workbuddy/config.json
          echo "config.json 字节数: $(wc -c < quark_skill/workbuddy/config.json)"
          INFO=$(cd quark_skill/scripts && node quark-drive.cjs get-user-info --session-input 诊断 --session-id diag-workers 2>&1 | tail -3)
          echo "授权自检: $INFO"
          case "$INFO" in
            *'"code":0'*|*'"code": 0'*) echo "授权 OK" ;;
            *) echo "::error::夸克授权失败：$INFO"; exit 1 ;;
          esac

      - name: 2. 造测试文件 + 写诊断脚本
        run: |
          cat > diag_up.py <<'PYEOF'
          import json, os, subprocess, sys, time, threading, queue

          folder = sys.argv[1]
          src_dir = sys.argv[2]
          WORKERS = int(os.environ.get("UPLOAD_WORKERS") or "4")
          SCRIPTS = "quark_skill/scripts"

          def cli(args, timeout=900):
              cmd = ["node", "quark-drive.cjs"] + args + [
                  "--session-input", "诊断", "--session-id", "diag-workers"]
              p = subprocess.run(cmd, capture_output=True, text=True,
                                 cwd=SCRIPTS, timeout=timeout)
              last = None
              for ln in (p.stdout or "").splitlines():
                  try:
                      o = json.loads(ln)
                  except Exception:
                      continue
                  if o.get("type") == "result":
                      last = o
              return last or {"code": -1, "msg": (p.stderr or "")[-300:]}

          # 建目录（幂等，5 次重试绕瞬时 1007）
          res = {}
          for _try in range(5):
              res = cli(["create-folder", "--dir-path", folder, "--parent-fid", "0"])
              print("create-folder(第%d次) -> %s %s" % (_try + 1, res.get("code"), res.get("msg")), flush=True)
              if res.get("code") == 0:
                  break
              time.sleep(8)
          if res.get("code") != 0:
              print("::error::建目录失败: %s" % res.get("msg"), flush=True)
              sys.exit(1)
          fid = ((res.get("data") or {}).get("fid")
                 or (res.get("data") or {}).get("id") or "")
          print("目标目录 %s fid = %s" % (folder, fid), flush=True)

          tasks = queue.Queue()
          for fn in sorted(os.listdir(src_dir)):
              tasks.put(os.path.join(src_dir, fn))
          DONE = object()

          results = []
          lock = threading.Lock()

          def worker():
              while True:
                  p = tasks.get()
                  if p is DONE:
                      break
                  name = os.path.basename(p)
                  sz = os.path.getsize(p)
                  t0 = time.time()
                  try:
                      r = cli(["upload", os.path.abspath(p), "--parent-fid", fid])
                  except subprocess.TimeoutExpired:
                      r = {"code": -1, "msg": "timeout"}
                  el = time.time() - t0
                  ok = (r.get("code") == 0)
                  with lock:
                      results.append({"name": name, "size": sz, "sec": round(el, 1),
                                      "ok": ok, "code": r.get("code"),
                                      "msg": (r.get("msg") or "")[:80],
                                      "instant": bool((r.get("data") or {}).get("instantUpload"))})
                  print("  %s %-14s %9d字节  用时 %6.1fs  均速 %5.2fMB/s" % (
                      "✓" if ok else "✗", name, sz, el, sz / 1048576.0 / max(el, 1)), flush=True)
                  tasks.task_done()

          t_start = time.time()
          cons = [threading.Thread(target=worker, daemon=True) for _ in range(WORKERS)]
          for c in cons:
              c.start()
          # ★ 2026-10-24 修：每个消费者一个哨兵。只放 1 个 DONE 时，
          #   先拿到它的消费者 break，其余消费者处理完任务后永远阻塞在
          #   tasks.get()，join() 卡死（实测段A 卡 18 分钟，文件其实传完了）。
          for _ in range(WORKERS):
              tasks.put(DONE)
          for c in cons:
              c.join()
          total_el = time.time() - t_start

          ok_n = sum(1 for r in results if r["ok"])
          tot_b = sum(r["size"] for r in results if r["ok"])
          print("==== 段汇总 %s ====" % folder, flush=True)
          print(json.dumps({
              "folder": folder, "workers": WORKERS, "files": len(results),
              "ok": ok_n, "fail": len(results) - ok_n,
              "total_bytes": tot_b, "total_sec": round(total_el, 1),
              "agg_mbps": round(tot_b / 1048576.0 / max(total_el, 1), 2),
              "details": results,
          }, ensure_ascii=False), flush=True)
          PYEOF
          python3 -m py_compile diag_up.py && echo "诊断脚本编译 OK"
          mkdir -p t4 t6
          for i in 1 2 3 4 5 6; do
            dd if=/dev/urandom of=t4/big$i.bin bs=1M count=300 status=none
            dd if=/dev/urandom of=t6/big$i.bin bs=1M count=300 status=none
          done
          for i in 1 2; do
            dd if=/dev/urandom of=t4/small$i.bin bs=1M count=8 status=none
            dd if=/dev/urandom of=t6/small$i.bin bs=1M count=8 status=none
          done
          du -sh t4 t6; df -h . | tail -1

      - name: 3. 段A：4 并发（对照组）
        env:
          UPLOAD_WORKERS: "4"
        run: python3 diag_up.py _diag_w4 t4

      - name: 4. 段B：6 并发（实验组）
        env:
          UPLOAD_WORKERS: "6"
        run: python3 diag_up.py _diag_w6 t6

      - name: 5. 完成
        run: |
          echo "诊断完成。回本机读两个「段汇总」JSON 对比 agg_mbps / total_sec。"
          echo "清理提醒：删 _diag_w4 / _diag_w6 后 DELETE 本 workflow。"
